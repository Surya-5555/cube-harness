[project]
name = "timewarp-cube"
version = "0.2.0"
description = "TimeWarp benchmark for cube — 231 temporal-UI web tasks across wiki/news/shop"
requires-python = ">=3.12"
dependencies = [
    "cube-standard>=0.1.0rc8",
    # reproducibility pin (PS-001): task_metadata.json is generated from this exact version.
    "browsergym-timewarp==0.2.0",
    "cube-browser-tool[bgym]>=0.3.0",
    "cube-chat-tool>=0.1.0",
]

[project.entry-points."cube.benchmarks"]
timewarp-cube = "timewarp_cube.benchmark:TimeWarpBenchmarkConfig"

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.uv-build]
include = ["src/timewarp_cube/task_metadata.json"]

[tool.uv.sources]
# TODO: drop once cube-browser-tool 0.3.0 ships to PyPI.
# Until then, 0.3.0 lives on cube-standard's dev branch
# (cube-tools/cube-browser-tool subdirectory); PyPI only has <=0.2.0.
cube-browser-tool = { git = "https://github.com/The-AI-Alliance/cube-standard", subdirectory = "cube-tools/cube-browser-tool" }

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.ruff]
fix = true
line-length = 120
indent-width = 4
